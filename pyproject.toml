[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "royal-cyber-lead-pipeline"
version = "0.1.0"
description = "Lead scraping, enrichment, segmentation, export, and monitoring pipeline."
requires-python = ">=3.10"
dependencies = [
    "requests==2.31.0",
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.0",
    "openpyxl==3.1.2",
    "pandas==2.2.0",
    "tqdm==4.66.1",
    "dnspython==2.6.1",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "playwright==1.60.0",
]

[project.scripts]
rc-lead-pipeline = "main:main"

[tool.setuptools]
packages = ["src", "src.agents"]
